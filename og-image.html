<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>og-image preview (1200x630)</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(1200px 520px at 18% -20%, rgba(0, 217, 119, 0.22), transparent 65%),
        radial-gradient(900px 480px at 100% 120%, rgba(255, 214, 10, 0.10), transparent 65%),
        linear-gradient(135deg, #050810 0%, #0c121d 50%, #131e2e 100%);
      border-bottom: 6px solid #00d977;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e8eef7;
    }
    .logo {
      max-width: 820px;
      width: 70%;
      height: auto;
      filter: drop-shadow(0 8px 30px rgba(0, 217, 119, 0.35));
      margin-bottom: 36px;
    }
    .meta {
      display: flex;
      gap: 28px;
      align-items: center;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #a8b4c8;
    }
    .meta .dot { width: 8px; height: 8px; border-radius: 50%; background: #397ED9; }
    .pill {
      margin-top: 30px;
      padding: 14px 26px;
      border-radius: 999px;
      background: rgba(57, 126, 217, 0.18);
      border: 1px solid rgba(57, 126, 217, 0.45);
      color: #8fb8ef;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="copamigos" />
    <div class="meta">
      <span>World Cup 2026</span>
      <span class="dot"></span>
      <span>Friends Pool</span>
    </div>
    <div class="pill">$30 IN · $300 TO THE WINNER</div>
  </div>
</body>
</html>
