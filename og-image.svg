<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03060d"/>
      <stop offset="55%" stop-color="#0a1422"/>
      <stop offset="100%" stop-color="#0d1f33"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00d977" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00d977" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#ce1126" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ce1126" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe98a"/>
      <stop offset="55%" stop-color="#f5c93a"/>
      <stop offset="100%" stop-color="#b9831e"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>

  <!-- subtle pitch lines (center circle + halves) -->
  <g stroke="#1c2a3e" stroke-width="2" fill="none" opacity="0.55">
    <line x1="600" y1="40" x2="600" y2="590"/>
    <circle cx="600" cy="315" r="120"/>
    <circle cx="600" cy="315" r="3" fill="#1c2a3e"/>
  </g>

  <!-- top flag stripe (MEX green | white | MEX red) -->
  <rect x="0" y="0" width="400" height="8" fill="#006847"/>
  <rect x="400" y="0" width="400" height="8" fill="#ffffff"/>
  <rect x="800" y="0" width="400" height="8" fill="#ce1126"/>

  <!-- bottom accent -->
  <rect x="0" y="622" width="1200" height="8" fill="#00d977"/>

  <!-- TROPHY (left) -->
  <g transform="translate(110 175)">
    <!-- handles -->
    <path d="M30 60 Q-25 60 -25 110 Q-25 170 50 175"
          fill="none" stroke="url(#goldFill)" stroke-width="14" stroke-linecap="round"/>
    <path d="M230 60 Q285 60 285 110 Q285 170 210 175"
          fill="none" stroke="url(#goldFill)" stroke-width="14" stroke-linecap="round"/>
    <!-- cup body -->
    <path d="M30 40 L230 40 L215 200 Q215 240 130 245 Q45 240 45 200 Z"
          fill="url(#goldFill)" stroke="#7a5410" stroke-width="2"/>
    <!-- shine -->
    <path d="M55 55 L100 55 L92 195 Q90 215 75 215 Q60 215 58 195 Z" fill="url(#goldShine)"/>
    <!-- rim -->
    <rect x="22" y="32" width="216" height="18" rx="4" fill="url(#goldFill)" stroke="#7a5410" stroke-width="2"/>
    <!-- stem + base -->
    <rect x="115" y="245" width="30" height="35" fill="url(#goldFill)"/>
    <rect x="70" y="278" width="120" height="20" rx="4" fill="url(#goldFill)" stroke="#7a5410" stroke-width="2"/>
    <rect x="55" y="295" width="150" height="14" rx="3" fill="url(#goldFill)" stroke="#7a5410" stroke-width="2"/>
    <!-- star -->
    <polygon points="130,90 140,118 170,118 146,135 156,165 130,148 104,165 114,135 90,118 120,118"
             fill="#fff8d5" opacity="0.85"/>
  </g>

  <!-- WORDMARK -->
  <text x="445" y="200" font-size="118" font-weight="900" fill="#ffffff" letter-spacing="-3">COPAMIGOS</text>
  <text x="445" y="240" font-size="22" font-weight="600" fill="#00d977" letter-spacing="6">FIFA WORLD CUP 2026 · FRIENDS POOL</text>

  <!-- divider -->
  <line x1="445" y1="270" x2="1090" y2="270" stroke="#2a3445" stroke-width="2"/>

  <!-- PRIZE ROW -->
  <g transform="translate(445 295)">
    <!-- 1st -->
    <g>
      <circle cx="22" cy="35" r="22" fill="#f5c93a"/>
      <text x="22" y="42" font-size="22" font-weight="800" fill="#3a2900" text-anchor="middle">1</text>
      <text x="55" y="30" font-size="34" font-weight="800" fill="#ffffff">$300</text>
      <text x="55" y="55" font-size="14" font-weight="600" fill="#8b95a7" letter-spacing="1">1ST PLACE</text>
    </g>
    <!-- 2nd -->
    <g transform="translate(220 0)">
      <circle cx="22" cy="35" r="22" fill="#c5cad6"/>
      <text x="22" y="42" font-size="22" font-weight="800" fill="#1d2330" text-anchor="middle">2</text>
      <text x="55" y="30" font-size="34" font-weight="800" fill="#ffffff">$200</text>
      <text x="55" y="55" font-size="14" font-weight="600" fill="#8b95a7" letter-spacing="1">2ND PLACE</text>
    </g>
    <!-- 3rd -->
    <g transform="translate(440 0)">
      <circle cx="22" cy="35" r="22" fill="#cd7f32"/>
      <text x="22" y="42" font-size="22" font-weight="800" fill="#2a1606" text-anchor="middle">3</text>
      <text x="55" y="30" font-size="34" font-weight="800" fill="#ffffff">$100</text>
      <text x="55" y="55" font-size="14" font-weight="600" fill="#8b95a7" letter-spacing="1">3RD PLACE</text>
    </g>
  </g>

  <!-- KICKOFF / TAGLINE -->
  <text x="445" y="430" font-size="36" font-weight="700" fill="#e6edf3">Predict every group-stage match.</text>
  <text x="445" y="475" font-size="28" font-weight="600" fill="#00d977">Kickoff · June 11, 2026</text>

  <!-- HOST FLAGS row -->
  <g transform="translate(445 510)">
    <text x="0" y="22" font-size="14" font-weight="600" fill="#8b95a7" letter-spacing="2">HOSTED BY</text>
    <!-- Mexico -->
    <g transform="translate(140 0)">
      <rect x="0" y="0" width="36" height="24" fill="#006847"/>
      <rect x="12" y="0" width="12" height="24" fill="#ffffff"/>
      <rect x="24" y="0" width="12" height="24" fill="#ce1126"/>
      <rect x="0" y="0" width="36" height="24" fill="none" stroke="#1c2a3e" stroke-width="1"/>
    </g>
    <text x="186" y="17" font-size="15" font-weight="600" fill="#e6edf3">Mexico</text>
    <!-- USA -->
    <g transform="translate(280 0)">
      <rect x="0" y="0" width="36" height="24" fill="#b22234"/>
      <rect x="0" y="3.4" width="36" height="3.4" fill="#fff"/>
      <rect x="0" y="10.2" width="36" height="3.4" fill="#fff"/>
      <rect x="0" y="17" width="36" height="3.4" fill="#fff"/>
      <rect x="0" y="0" width="15" height="13" fill="#3c3b6e"/>
      <rect x="0" y="0" width="36" height="24" fill="none" stroke="#1c2a3e" stroke-width="1"/>
    </g>
    <text x="326" y="17" font-size="15" font-weight="600" fill="#e6edf3">USA</text>
    <!-- Canada -->
    <g transform="translate(395 0)">
      <rect x="0" y="0" width="12" height="24" fill="#d52b1e"/>
      <rect x="12" y="0" width="12" height="24" fill="#ffffff"/>
      <rect x="24" y="0" width="12" height="24" fill="#d52b1e"/>
      <polygon points="18,7 19.5,11 24,11 20.5,14 22,18 18,15.5 14,18 15.5,14 12,11 16.5,11"
               fill="#d52b1e"/>
      <rect x="0" y="0" width="36" height="24" fill="none" stroke="#1c2a3e" stroke-width="1"/>
    </g>
    <text x="441" y="17" font-size="15" font-weight="600" fill="#e6edf3">Canada</text>
  </g>

  <!-- URL chip -->
  <g transform="translate(990 570)">
    <rect x="-8" y="0" width="120" height="32" rx="6" fill="#00d977"/>
    <text x="52" y="22" font-size="16" font-weight="800" fill="#03240f" text-anchor="middle">copamigos.com</text>
  </g>
</svg>
