<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="50%" stop-color="#0c121d"/>
      <stop offset="100%" stop-color="#131e2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00d977" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00d977" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- soccer ball -->
  <g transform="translate(180 240) scale(4.5)">
    <circle cx="20" cy="20" r="18" fill="#ffffff" stroke="#000" stroke-opacity="0.15" stroke-width="0.8"/>
    <polygon points="20,10 26.5,14.7 24,22.2 16,22.2 13.5,14.7" fill="#0a3b1f"/>
    <line x1="20" y1="10" x2="20" y2="3" stroke="#0a3b1f" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="26.5" y1="14.7" x2="33" y2="12.5" stroke="#0a3b1f" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="13.5" y1="14.7" x2="7" y2="12.5" stroke="#0a3b1f" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="24" y1="22.2" x2="28" y2="29" stroke="#0a3b1f" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="16" y1="22.2" x2="12" y2="29" stroke="#0a3b1f" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- text -->
  <text x="450" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="800" fill="#e6edf3" letter-spacing="-1">World Cup 2026</text>
  <text x="450" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="800" fill="#00d977" letter-spacing="-1">Fantasy</text>
  <text x="450" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#8b95a7" letter-spacing="2.5" text-transform="uppercase">GROUP STAGE PREDICTIONS</text>

  <!-- host country dots -->
  <circle cx="450" cy="490" r="9" fill="#006847"/>
  <circle cx="478" cy="490" r="9" fill="#ffffff"/>
  <circle cx="506" cy="490" r="9" fill="#ce1126"/>
  <text x="535" y="498" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="#8b95a7">USA · Canada · Mexico</text>

  <!-- bottom accent line -->
  <rect x="0" y="624" width="1200" height="6" fill="#00d977"/>
</svg>
